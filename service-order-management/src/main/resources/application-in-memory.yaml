micronaut:
  caches:
    entities:
      maximumSize: 1000
      # bounds stale reads to 2s; dedups one request's reads of an entity (get after create/update, reference checks)
      expire-after-write: 2s
      expire-after-access: 2s
    # broker-only: NGSI-LD subscriptions (NgsiLdSubscriptionRepository), unused on postgresql
    subscriptions:
      maximumSize: 1000
      expire-after-write: 14d
      expire-after-access: 14d
    # access-policy PDP verdicts (DecisionCache); entries also carry min(token exp, decision-ttl)
    decisions:
      maximumSize: 10000
      expire-after-write: ${access-policy.decision-ttl:60s}
