micronaut:
  caches:
    entities:
      maximumSize: 1000
      # bounds stale reads to 2s; dedups one request's reads of an entity (get after create/update, reference checks)
      expire-after-write: 2s
      expire-after-access: 2s
    subscriptions:
      maximumSize: 1000
      expire-after-write: 10s
      expire-after-access: 10s
