redis:
  uri: redis://localhost:6379
  caches:
    entities:
      # short enough to avoid stale reads; dedups one request's reads of an entity (get after create/update, reference checks)
      expire-after-write: 2s
      expire-after-access: 2s
      value-serializer: io.github.wistefan.mapping.EntityVOSerializer
    subscriptions:
      expire-after-write: 10s
      expire-after-access: 10s
      value-serializer: io.github.wistefan.mapping.EntityVOSerializer
