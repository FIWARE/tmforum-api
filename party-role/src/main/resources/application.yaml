micronaut:

  codec:
    json:
      additional-types:
        - application/ld+json

  server:
    port: 8632

  metrics:
    enabled: true
    export:
      prometheus:
        step: PT2s
        descriptions: false

  http:
    services:
      ngsi:
        path: ngsi-ld/v1
        url: http://localhost:1026
        read-timeout: 30s

jackson:
  # Micronaut's NON_EMPTY default breaks empty-list handling
  serialization-inclusion: non_null
  # Jackson 3 sorts properties alphabetically by default; keep declaration order
  mapper-features:
    sort-properties-alphabetically: false
  deserialization-features:
    fail-on-null-for-primitives: false
  date-time-features:
    write-dates-as-timestamps: false

endpoints:
  metrics:
    enabled: true
  health:
    enabled: true


logger:
  levels:
    ROOT: WARN


general:
  contextUrl: https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld
  serverHost: http://localhost:8632
  countHeader: NGSILD-Results-Count
api:
  party-role:
    basepath: ${general.basepath:/}
