micronaut:
  caches:
    entities:
      maximumSize: 1000
      # short enough to avoid stale reads; dedups one request's reads of an entity (get after create/update, reference checks)
      expire-after-write: 2s
      expire-after-access: 2s
    subscriptions:
      maximumSize: 1000
      expire-after-write: 14d
      expire-after-access: 14d
