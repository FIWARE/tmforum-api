# PostgreSQL storage (Micronaut environment "postgresql"); the NGSI-LD broker is not used.
r2dbc:
  datasources:
    default:
      url: r2dbc:pool:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tmforum}
      username: ${POSTGRES_USER:tmforum}
      password: ${POSTGRES_PASSWORD:tmforum}

# migrates the schema over JDBC at startup; the data path is R2DBC only
flyway:
  datasources:
    default:
      enabled: true
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tmforum}
      user: ${POSTGRES_USER:tmforum}
      password: ${POSTGRES_PASSWORD:tmforum}
      schemas: tmforum
      create-schemas: true
      locations: classpath:db/migration/tmforum

tmforum:
  outbox:
    enabled: true
    poll-interval: 1s
    batch-size: 20
    lease: 10m
    max-backoff: 1h
    retention: 7d
    housekeeping-interval: 1m

endpoints:
  health:
    postgresql:
      timeout: 5s
    # the postgresql readiness indicator covers the database
    r2dbc:
      enabled: false
