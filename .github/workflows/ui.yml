name: UI

# The tmf-ui (module `ui`) is static files generated in part from the API modules, so it
# has to be rechecked whenever one of them changes, not only when ui/ does.
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'all-in-one/**'
      - 'api/**'
      # the domain classes: URN types and reference fields, in more packages than domain/
      - '*/src/main/java/**'
      - '.github/workflows/ui.yml'

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          for f in ui/src/main/resources/tmf-ui/*.js ui/server/server.mjs ui/scripts/gen-catalog.mjs; do
            node --check "$f"
          done

      # catalog.js is committed so that neither the build nor the page needs Node. This is
      # what keeps it from drifting: regenerate, and fail on any difference.
      - name: Catalogue is up to date
        run: |
          node ui/scripts/gen-catalog.mjs
          git diff --exit-code -- ui/src/main/resources/tmf-ui/catalog.js \
            || { echo "::error::catalog.js is stale - run 'npm run gen-catalog' in ui/ and commit the result"; exit 1; }

  # What the tmforum-ui image runs: the page, the probe, the proxy - and, with TMF_ENDPOINT,
  # a proxy that refuses every other origin.
  served:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The server serves the page and proxies GETs, and only to TMF_ENDPOINT when set
        run: |
          trap 'kill $(jobs -p)' EXIT
          TMF_MOCK=1 PORT=8080 node ui/server/server.mjs &
          TMF_MOCK=1 PORT=8081 TMF_ENDPOINT=http://localhost:8081/mock node ui/server/server.mjs &
          for port in 8080 8081; do
            timeout 10 sh -c "until curl -sf http://localhost:$port/healthz; do sleep 0.2; done"
          done
          set -x
          curl -sf http://localhost:8080/ | grep -q '<title>TMF UI</title>'
          for f in app.js refs.js catalog.js styles.css config.json; do curl -sf -o /dev/null "http://localhost:8080/$f"; done
          offering='tmf-api/productCatalogManagement/v4/productOffering'
          curl -sf -o /dev/null "http://localhost:8080/api/proxy?url=http://localhost:8080/mock/$offering"
          curl -sf "http://localhost:8081/config.json" | grep -q '"locked":true'
          curl -sf -o /dev/null "http://localhost:8081/api/proxy?url=http://localhost:8081/mock/$offering"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/proxy?url=http://example.com/')" = 403
